<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { border: 4px solid #000; padding: 20px; background: #000; color: #fff; }
        .content { border-left: 4px solid #000; border-right: 4px solid #000; border-bottom: 4px solid #000; padding: 20px; }
        .button { display: inline-block; background: #000; color: #fff; padding: 10px 20px; text-decoration: none; border: 2px solid #000; }
        .footer { font-size: 12px; color: #666; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Fortivault</h1>
        </div>
        <div class="content">
            <h2>Activate Your Account</h2>
            <p>Welcome to Fortivault! Please activate your account to get started.</p>
            <p><a href="{{ activation_url }}" class="button">Activate Account</a></p>
            <p>This activation link expires in <strong>24 hours</strong>.</p>
            <p style="font-size: 12px; color: #999;">If you didn't request this account, you can safely ignore this email.</p>
        </div>
        <div class="footer">
            <p>Fortivault - Industrial-Grade Secret Manager</p>
        </div>
    </div>
</body>
</html>
