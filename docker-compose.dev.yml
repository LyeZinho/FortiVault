version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fortivault-backend-dev
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/app/data/vault.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-min-32-characters-long}
      - DEBUG=true
      - LOG_LEVEL=debug
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./backend:/app
      - vault_data_dev:/app/data
      - backup_data_dev:/app/backups
    restart: unless-stopped
    command: [
      "python", "-m", "uvicorn", 
      "main:app", 
      "--host", "0.0.0.0", 
      "--port", "8000", 
      "--reload", 
      "--log-level", "debug"
    ]
    networks:
      - fortivault-network-dev

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: fortivault-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - fortivault-network-dev

  # Database viewer (optional for development)
  adminer:
    image: adminer
    container_name: fortivault-adminer-dev
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=sqlite:///app/data/vault.db
    volumes:
      - vault_data_dev:/app/data:ro
    depends_on:
      - backend
    networks:
      - fortivault-network-dev

volumes:
  vault_data_dev:
    driver: local
  backup_data_dev:
    driver: local

networks:
  fortivault-network-dev:
    driver: bridge